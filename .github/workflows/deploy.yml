name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set; skipping deploy. See docs/operations/cloudflare.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.creds.outputs.ready == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install wrangler
        if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile --filter @planner/web

      # Deploy exactly the files that CI tested.
      - uses: actions/download-artifact@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          name: web-out
          path: apps/web/out

      - name: Deploy
        id: deploy
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/web
        run: |
          pnpm exec wrangler deploy --message "${GITHUB_SHA::7}" | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        if: steps.creds.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS "${{ steps.deploy.outputs.url }}" | grep -q "Planner Designer"; then
              echo "Smoke test passed"; exit 0
            fi
            sleep 5
          done
          echo "::error::Deployed site did not respond as expected"; exit 1

      - name: Roll back on failure
        if: failure() && steps.deploy.outcome == 'success'
        working-directory: apps/web
        run: pnpm exec wrangler rollback --message "Automatic rollback after failed smoke test (${GITHUB_SHA::7})"
