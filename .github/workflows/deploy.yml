name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      WRANGLER_SEND_METRICS: false
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set; skipping deploy. See docs/operations/cloudflare.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.ready == 'true'

      - uses: pnpm/action-setup@v6
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the Worker and wrangler
        if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile --filter "@planner/worker..."

      # Deploy exactly the files that CI tested.
      - uses: actions/download-artifact@v8
        if: steps.creds.outputs.ready == 'true'
        with:
          name: web-out
          path: apps/web/out

      - name: Deploy
        id: deploy
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/worker
        run: |
          pnpm exec wrangler deploy --message "${GITHUB_SHA::7}" | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        if: steps.creds.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          ok=false
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$URL/en" | grep -q "Planner Designer"; then ok=true; break; fi
            sleep 5
          done
          [ "$ok" = true ] || { echo "::error::The site did not respond as expected"; exit 1; }
          if ! curl -fsS "$URL/api/export/health" | grep -q '"ok":true'; then
            echo "::error::PDF export is not available (is Browser Run enabled?)"; exit 1
          fi
          if ! curl -fsSIL "$URL/en" | grep -qi "^content-security-policy:"; then
            echo "::error::Security headers are missing"; exit 1
          fi
          echo "Smoke test passed: site, PDF export, security headers" >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back on failure
        if: failure() && steps.deploy.outcome == 'success'
        working-directory: apps/worker
        run: pnpm exec wrangler rollback --message "Automatic rollback after failed smoke test (${GITHUB_SHA::7})"
